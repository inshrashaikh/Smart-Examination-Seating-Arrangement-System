# ---------------------------------------------------------------------------
# Default profile: MySQL 8
# Create the schema first:  CREATE DATABASE examseat;
# ---------------------------------------------------------------------------
spring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:examseat}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# JWT
app.jwt.secret=change-me-in-production-4f8b2c1a9e6d5c3b7a0f4e2d8c6b1a3f5e7d9c0b2a4f6e8d1c3b5a7f9e2d4c6b
app.jwt.access-token-validity-ms=86400000

# Comma separated allowed origins
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Seed demo data on boot (200 students, 8 halls, 5 exams, users)
app.seed.enabled=true

# Python OR-Tools optimizer service (FastAPI). Blank = AUTO uses the Java engine.
app.optimizer.url=${OPTIMIZER_URL:http://localhost:8000}
app.optimizer.timeout-ms=30000

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always