# ---------------------------------------------------------------------------
# In-memory H2 profile for quick testing:   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Schema + seed data are created automatically on every boot.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:examseat;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

app.jwt.secret=change-me-in-production-4f8b2c1a9e6d5c3b7a0f4e2d8c6b1a3f5e7d9c0b2a4f6e8d1c3b5a7f9e2d4c6b
app.jwt.access-token-validity-ms=86400000

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

app.seed.enabled=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always